<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Studies — Saharsh Wadekar</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeade;color:#25251f;font:17px/1.45 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:clamp(18px,5vw,68px)}header,footer,.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header,footer{font:13px monospace;border-block-end:1px solid;padding-bottom:14px}a{color:inherit;text-underline-offset:4px}h1{font:clamp(56px,11vw,148px)/.85 Georgia,serif;letter-spacing:-.075em;margin:44px 0 18px}h1 i{color:#974122}p{max-width:55ch}.stage{position:relative;border:1px solid #44473e;background:#1e2926;color:#f4f1df;overflow:hidden;margin:24px 0 12px}.stage canvas{width:100%;height:clamp(190px,27vw,300px);display:block;touch-action:pan-y}.caption{padding:12px 18px;border-top:1px solid #778178;min-height:54px}.controls{justify-content:flex-start}button{font:inherit;background:transparent;color:inherit;border:1px solid #89897b;padding:9px 14px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#272d25;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #bd582a;outline-offset:3px}footer{margin-top:32px;border-block-start:1px solid;border-block-end:0;padding-top:14px}small{font:13px monospace}
</style></head><body><main><header><b>Saharsh Wadekar</b><span>Full stack engineer · Pune, India</span></header><h1>Field <i>studies.</i></h1><p>Three problems from my work, drawn live. Pick a study, then move across the drawing or use ← and → to scrub through its build.</p><div class="controls" id="tabs"><button aria-pressed="true">1 · Field visit</button><button aria-pressed="false">2 · Reconciliation</button><button aria-pressed="false">3 · Radar</button></div><section class="stage"><canvas aria-label="Animated engineering study. Use the timeline below for keyboard control."></canvas><div class="caption" id="caption"></div></section><div class="controls"><button id="play">Replay</button><label>Timeline <input aria-label="Build progress" type="range" id="timeline" min="0" max="100" value="0"></label><a id="project" href="/work/dealermatix-dms">Explore field visits ↗</a></div><footer><a href="/">Portfolio</a><small>Keyboard · 1–3 select · ← → scrub</small><a href="https://github.com/saharshwadekar">GitHub ↗</a></footer></main><script>
const studies=[
 {color:'#b4ecd2',names:['Capture','Queue','Verify'],note:'A field rep checks in offline. The phone keeps the visit until Apex can verify it.',link:'/work/dealermatix-dms',label:'Explore field visits'},
 {color:'#fccd82',names:['Statement','Match','Ledger'],note:'In Xmatix, I built the panel that pairs bank statement lines with ledger records.',link:'/work/xmatix',label:'Explore Xmatix'},
 {color:'#ccc0fc',names:['Sweep','Sequence','Forecast'],note:'Our ConvLSTM uses 13 Doppler radar frames to predict the next one.',link:'https://ieeexplore.ieee.org/document/11583853',label:'Read the paper'}];
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),buttons=[...document.querySelectorAll('#tabs button')],slider=document.querySelector('#timeline'),replay=document.querySelector('#play'),motion=matchMedia('(prefers-reduced-motion: reduce)');
let index=0,progress=1,frame=0;
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);const s=studies[index],mid=h*.49;
ctx.fillStyle='#50605a';for(let x=8;x<w;x+=17)for(let y=8;y<h;y+=17)ctx.fillRect(x,y,1,1);
for(let j=0;j<3;j++){const x=w*(j+.5)/3,r=Math.min(w*.095,59),t=Math.max(0,Math.min(1,progress*1.8-j*.38));ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
for(let k=0;k<=100*t;k++){const a=k*Math.PI/50;let px,py;if(index===0){px=Math.cos(a)*r*(1+.13*Math.sin(3*a+j));py=Math.sin(a)*r*.72+Math.sin(2*a)*r*.15}else if(index===1){px=(k/50-1)*r;py=(Math.floor(k/19)%2-.5)*r*.65+j*2}else{px=Math.cos(a*2)*r*(.18+.82*k/100);py=Math.sin(a*2)*r*(.18+.82*k/100)}if(k===0)ctx.moveTo(x+px,mid+py);else ctx.lineTo(x+px,mid+py);if(k===Math.floor(100*t)){ctx.stroke();pointer(x+px,mid+py,s.color)}}
ctx.fillStyle='#f5f4df';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText(s.names[j].slice(0,Math.ceil(t*s.names[j].length)),x,h-24)}
slider.value=Math.round(progress*100)}
function pointer(x,y,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+4,y+17);ctx.lineTo(x+8,y+10);ctx.lineTo(x+17,y+8);ctx.closePath();ctx.fill()}
function scrub(p){cancelAnimationFrame(frame);progress=Math.max(0,Math.min(1,p));draw()}
function animate(){cancelAnimationFrame(frame);if(motion.matches){scrub(1);return}const start=performance.now();function tick(now){progress=Math.min(1,(now-start)/2700);draw();if(progress<1)frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
function select(i){index=i;buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const s=studies[i];document.querySelector('#caption').textContent=s.note;const a=document.querySelector('#project');a.href=s.link;a.textContent=s.label+' ↗';animate()}
buttons.forEach((b,i)=>b.onclick=()=>select(i));slider.oninput=()=>scrub(slider.value/100);replay.onclick=animate;
canvas.onpointermove=e=>{if(e.pointerType==='mouse'||e.buttons)scrub((e.clientX-canvas.getBoundingClientRect().left)/canvas.clientWidth)};canvas.onpointerdown=e=>scrub((e.clientX-canvas.getBoundingClientRect().left)/canvas.clientWidth);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;if(/^[1-3]$/.test(e.key))select(Number(e.key)-1);if(e.target!==slider&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();scrub(progress+(e.key==='ArrowRight'?.05:-.05))}});new ResizeObserver(draw).observe(canvas);select(0);
</script></body></html>
